<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #19191a;
            --text-color: #ffffff;
            --text-muted: #939393;
            --accent-color: #3b82f6;
            --accent-light: #60a5fa;
            --toggle-bg: #555;
            --panel-bg: rgba(59, 130, 246, 0.1);
        }

        body.light-theme {
            --bg-color: #f5f5f5;
            --text-color: #1a1a1a;
            --text-muted: #666666;
            --accent-color: #2563eb;
            --accent-light: #1d4ed8;
            --toggle-bg: #ccc;
            --panel-bg: rgba(37, 99, 235, 0.1);
        }

        body {
            width: 260px;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        /* Кнопка переключения темы */
        .theme-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.2);
        }

        img {
            width: 64px;
            height: 64px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));
        }
        h2 {
            font-size: 18px;
            margin: 0 0 8px 0;
            color: var(--accent-color);
        }
        p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 15px 0;
            line-height: 1.4;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--panel-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px;
        }
        .toggle-row span {
            font-size: 13px;
            color: var(--accent-light);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-color);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <button class="theme-btn" id="theme-btn">🌞</button>
    <img src="icon128.png" alt="Иконка">
    <h2>VK Video Cleaner</h2>
    <p>Скрывает правую панель с рекомендациями.</p>
    <div class="toggle-row">
        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
        <span id="status-text">Включено</span>
    </div>
    <script src="popup.js"></script>
</body>
</html>
